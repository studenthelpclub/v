<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHC ADMIN PRO | Strict Secure Access</title>
    
    <link rel="icon" type="image/png" href="https://studenthelpclub.in/favicon.png">
    <link rel="apple-touch-icon" href="https://studenthelpclub.in/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        body { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; border: 2px solid white; }
        .login-screen { position: fixed; inset: 0; z-index: 100; background: #0f172a; display: flex; align-items: center; justify-content: center; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="loginScreen" class="login-screen px-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-sm animate-fade-in text-center">
            <div class="bg-teal-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-user-shield text-teal-600 text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter mb-6">Session Login</h2>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Admin Email</label>
                    <input type="email" id="emailInput" placeholder="Email" class="w-full p-4 rounded-2xl border-2 border-slate-50 focus:border-teal-500 outline-none bg-slate-50 font-bold text-slate-700">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                    <input type="password" id="passInput" placeholder="••••••••" class="w-full p-4 rounded-2xl border-2 border-slate-50 focus:border-teal-500 outline-none bg-slate-50 font-bold text-slate-700">
                </div>
                <button onclick="handleLogin()" class="w-full bg-teal-600 text-white py-4 rounded-2xl font-black shadow-xl hover:bg-teal-700 active:scale-95 transition mt-4">
                    UNLOCK SESSION
                </button>
            </div>
            <p class="text-[9px] text-slate-400 mt-6 font-bold uppercase tracking-widest leading-loose">Session expires automatically<br>when you close this tab or browser</p>
        </div>
    </div>

    <div id="appContent" class="hidden">
        <nav class="bg-teal-800 text-white p-4 shadow-xl sticky top-0 z-50">
            <div class="max-w-md mx-auto flex justify-between items-center px-2">
                <button id="backBtn" onclick="showDashboard()" class="hidden p-2"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 class="text-xs font-black flex-grow text-center tracking-[0.2em] uppercase">SHC ADMIN PRO</h1>
                <div class="flex items-center space-x-4">
                    <div class="relative cursor-pointer" onclick="openCart()">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="cartCount" class="cart-badge hidden">0</span>
                    </div>
                    <button onclick="logout()" class="p-2 text-teal-300 hover:text-white transition"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
        </nav>

        <div id="dashboardView" class="p-4 max-w-md mx-auto animate-fade-in">
            <div class="bg-white rounded-[2rem] shadow-sm p-6 mb-6 border border-gray-100">
                <button onclick="showSearch()" class="w-full flex items-center justify-between bg-teal-600 p-5 rounded-2xl text-white shadow-lg active:scale-95 transition">
                    <div class="flex items-center text-left">
                        <div class="bg-white/20 p-3 rounded-xl mr-4"><i class="fa-solid fa-magnifying-glass text-xl text-center"></i></div>
                        <div><span class="block font-black text-lg leading-tight">Assignment Inventory</span><span class="text-[9px] uppercase font-bold opacity-80 tracking-widest">Search & Multi-Share</span></div>
                    </div>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6 text-center">
                <a href="https://t.me/studenthelpclub" target="_blank" class="bg-white p-5 rounded-3xl border border-gray-100"><i class="fa-brands fa-telegram text-blue-500 text-3xl mb-2 block"></i><span class="text-[10px] font-black uppercase">TG Channel</span></a>
                <a href="https://t.me/studenthelpclubofficial" target="_blank" class="bg-white p-5 rounded-3xl border border-gray-100"><i class="fa-solid fa-users-rectangle text-sky-600 text-3xl mb-2 block"></i><span class="text-[10px] font-black uppercase">TG Group</span></a>
                <a href="https://whatsapp.com/channel/0029VbCJ2xI7IUYa1zMB6n1f" target="_blank" class="bg-white p-5 rounded-3xl border border-gray-100"><i class="fa-brands fa-whatsapp text-green-500 text-3xl mb-2 block"></i><span class="text-[10px] font-black uppercase">WA Channel</span></a>
                <a href="https://chat.whatsapp.com/Hl7Wdd7xVrFD1H4LWmcJuZ" target="_blank" class="bg-white p-5 rounded-3xl border border-gray-100"><i class="fa-solid fa-comments text-emerald-600 text-3xl mb-2 block"></i><span class="text-[10px] font-black uppercase">WA Group</span></a>
                <a href="https://www.youtube.com/@vishalhelpclub" target="_blank" class="bg-white p-5 rounded-3xl border border-gray-100"><i class="fa-brands fa-youtube text-red-600 text-3xl mb-2 block"></i><span class="text-[10px] font-black uppercase">YouTube</span></a>
                <a href="https://www.facebook.com/groups/studenthelpclub" target="_blank" class="bg-white p-5 rounded-3xl border border-gray-100"><i class="fa-brands fa-facebook text-blue-700 text-3xl mb-2 block"></i><span class="text-[10px] font-black uppercase">FB Group</span></a>
            </div>
            
            <a href="https://business.facebook.com/latest/inbox" target="_blank" class="w-full bg-white p-5 rounded-2xl border border-gray-100 flex items-center justify-center space-x-3 shadow-sm active:scale-95 transition">
                <i class="fa-brands fa-facebook-messenger text-blue-600 text-2xl"></i>
                <span class="font-black text-slate-800 uppercase text-[10px] tracking-widest">Meta Business Inbox</span>
            </a>
        </div>

        <div id="searchView" class="hidden p-4 max-w-md mx-auto animate-fade-in">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 mb-6">
                <input type="text" id="searchInput" placeholder="Enter Subject Code..." class="w-full p-4 rounded-2xl border-2 border-slate-50 focus:border-teal-500 outline-none transition bg-slate-50 font-bold text-center">
            </div>
            <div id="loading" class="hidden text-center my-12"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-teal-500 border-t-transparent"></div></div>
            <div id="results" class="space-y-4 pb-32"></div>
        </div>

        <div id="cartModal" class="hidden fixed inset-0 z-[60] bg-slate-900/80 backdrop-blur-md flex items-end justify-center">
            <div class="bg-white w-full max-w-md rounded-t-[3rem] p-8 animate-fade-in border-t-4 border-teal-600">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Cart Selection</h2>
                    <button onclick="closeCart()" class="text-slate-300 p-2"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
                </div>
                <input type="text" id="customerName" placeholder="Customer Name (Optional)" class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 font-bold mb-4 outline-none focus:border-teal-500">
                <div id="cartItems" class="max-h-[30vh] overflow-y-auto space-y-3 mb-6 scrollbar-hide"></div>
                <button onclick="shareCart()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black shadow-lg flex items-center justify-center space-x-3 active:scale-95 transition">
                    <i class="fa-brands fa-whatsapp text-2xl"></i><span class="uppercase text-sm tracking-widest">Send To WhatsApp</span>
                </button>
                <button onclick="clearCart()" class="w-full text-red-500 font-black text-[10px] uppercase py-2 mt-4 tracking-widest">Clear Selection</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxnzi3hMsnuPKIaH3xnfcnrBnrfhlKcQ_qvBxQlmBgImmrD5xugJr7HTsszIE5x9XEb/exec";
        const VALID_EMAIL = "admin@shc.in"; 
        const VALID_PASS = "shcvishal2006"; 

        let assignmentsData = [];
        let cart = [];

        // LOGIN LOGIC
        function handleLogin() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            if (email === VALID_EMAIL && pass === VALID_PASS) {
                sessionStorage.setItem('shc_session', 'active');
                unlockApp();
            } else { alert("Incorrect Credentials!"); }
        }

        function unlockApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            loadCart();
        }

        function logout() { 
            sessionStorage.removeItem('shc_session'); 
            localStorage.removeItem('shc_admin_cart'); // Mobile safety: clearing cart on logout
            location.reload(); 
        }

        // AUTO-LOGOUT ON TAB CLOSE OR INACTIVITY (MOBILE OPTIMIZED)
        window.onload = function() {
            if (sessionStorage.getItem('shc_session') === 'active') { 
                unlockApp(); 
            }
        };

        // Strict Mobile Logout Logic: If user switches app or closes browser
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                // Background mein jate hi login required kar dega next time ke liye
                // sessionStorage automatic handles tab close, but this adds extra layer
            }
        });

        // UI & SEARCH LOGIC
        function saveCart() { localStorage.setItem('shc_admin_cart', JSON.stringify(cart)); }
        function loadCart() { const saved = localStorage.getItem('shc_admin_cart'); if (saved) { cart = JSON.parse(saved); updateCartUI(); } }
        function showSearch() { document.getElementById('dashboardView').classList.add('hidden'); document.getElementById('searchView').classList.remove('hidden'); document.getElementById('backBtn').classList.remove('hidden'); if (assignmentsData.length === 0) fetchAllData(); }
        function showDashboard() { document.getElementById('dashboardView').classList.remove('hidden'); document.getElementById('searchView').classList.add('hidden'); document.getElementById('backBtn').classList.add('hidden'); }

        async function fetchAllData() {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            try { 
                const response = await fetch(API_URL, { redirect: 'follow' }); 
                assignmentsData = await response.json(); 
            } catch (err) { console.error("Fetch error:", err); }
            loading.classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsDiv = document.getElementById('results');
            if(query.length < 2) { resultsDiv.innerHTML = ''; return; }
            const filtered = assignmentsData.filter(item => item.code.toLowerCase().includes(query));
            resultsDiv.innerHTML = filtered.map(item => {
                let fileId = item.link.includes('id=') ? item.link.split('id=')[1] : item.link.split('/d/')[1]?.split('/')[0];
                const previewLink = `https://drive.google.com/file/d/${fileId}/preview`;
                return `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 text-left mb-4 animate-fade-in">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[9px] font-black text-teal-600 bg-teal-50 px-2 py-1 rounded uppercase tracking-widest">${item.medium}</span>
                            <h3 class="font-black text-xl text-slate-900 uppercase">${item.code}</h3>
                        </div>
                        <a href="${previewLink}" target="_blank" class="p-3 bg-blue-50 rounded-2xl text-blue-500 hover:bg-blue-100 transition"><i class="fa-solid fa-eye"></i></a>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                         <button onclick="addToCart('${item.code}', '${item.medium}', '${item.link}')" class="bg-slate-100 text-slate-800 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest active:bg-teal-600 active:text-white transition">ADD TO CART</button>
                         <button onclick="directShare('${item.code}', '${item.medium}', '${item.link}')" class="bg-green-500 text-white py-3 rounded-xl font-black text-[10px] active:scale-95 transition">SEND NOW</button>
                    </div>
                </div>`;
            }).join('');
        });

        function addToCart(code, medium, link) { if (!cart.some(i => i.code === code)) { cart.push({code, medium, link}); saveCart(); updateCartUI(); } }
        function updateCartUI() { 
            document.getElementById('cartCount').innerText = cart.length; 
            document.getElementById('cartCount').classList.toggle('hidden', cart.length === 0); 
            document.getElementById('cartItems').innerHTML = cart.map((item, index) => `<div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-2"><div class="text-left font-black text-slate-800 uppercase text-[10px] tracking-widest">${item.code}</div><button onclick="removeFromCart(${index})" class="text-red-300 p-2"><i class="fa-solid fa-trash-can"></i></button></div>`).join(''); 
        }
        function removeFromCart(index) { cart.splice(index, 1); saveCart(); updateCartUI(); }
        function clearCart() { cart = []; saveCart(); updateCartUI(); closeCart(); }
        function openCart() { document.getElementById('cartModal').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cartModal').classList.add('hidden'); }

        const WEB_INFO = "\n\n━━━━━━━━━━━━━━━━━━━━\n📚 *Aur Assignments ke liye website check karein:*\n🌐 https://studenthelpclub.in\n━━━━━━━━━━━━━━━━━━━━";

        function directShare(code, medium, link) {
            const text = `*STUDENT HELP CLUB - Delivery*\n\n✅ *Code:* ${code}\n🌐 *Medium:* ${medium}\n📥 *Download:* ${link}${WEB_INFO}\n\n_Regards, Vishal Kumar_`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function shareCart() {
            if (cart.length === 0) return;
            const name = document.getElementById('customerName').value.trim();
            const greeting = name ? `Namaste *${name}*!` : `Namaste!`;
            let list = `*STUDENT HELP CLUB - Delivery*\n\n${greeting} Aapke assignments niche hain:\n\n`;
            cart.forEach((item, index) => { list += `${index + 1}. *${item.code}* (${item.medium})\n🔗 ${item.link}\n\n`; });
            list += `--- ${WEB_INFO}\n_Study hard, achieve big!_ \nRegards, *Vishal Kumar*`;
            window.open(`https://wa.me/?text=${encodeURIComponent(list)}`, '_blank');
            clearCart();
        }
    </script>
</body>
</html>
